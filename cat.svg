<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="fur" cx="0.35" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#7d86a0"/><stop offset="0.4" stop-color="#3a4054"/><stop offset="1" stop-color="#12151d"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5169"/><stop offset="1" stop-color="#171a24"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#eaffd6"/><stop offset="0.5" stop-color="#6bff4d"/><stop offset="1" stop-color="#1c9b2a"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <line x1="0" y1="232" x2="800" y2="232" stroke="#8892a6" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <g>
    <animateTransform attributeName="transform" type="translate" values="-140 230;940 230" dur="14s" repeatCount="indefinite"/>

    <!-- shadow -->
    <ellipse cx="0" cy="2" rx="85" ry="9" fill="#000" opacity="0.28">
      <animate attributeName="rx" values="85;76;85" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.5s" repeatCount="indefinite"/>

      <!-- far legs (darker) -->
      <g transform="translate(-30 -38)"><g>
        <animateTransform attributeName="transform" type="rotate" values="22 0 0;-22 0 0;22 0 0" dur="1s" repeatCount="indefinite"/>
        <rect x="-7" y="0" width="14" height="34" rx="7" fill="#1b1f2b"/>
        <ellipse cx="3" cy="36" rx="12" ry="7" fill="#262b3a"/>
      </g></g>
      <g transform="translate(42 -38)"><g>
        <animateTransform attributeName="transform" type="rotate" values="-22 0 0;22 0 0;-22 0 0" dur="1s" repeatCount="indefinite"/>
        <rect x="-7" y="0" width="14" height="34" rx="7" fill="#1b1f2b"/>
        <ellipse cx="3" cy="36" rx="12" ry="7" fill="#262b3a"/>
      </g></g>

      <!-- tail -->
      <g transform="translate(-60 -62)"><g>
        <animateTransform attributeName="transform" type="rotate" values="-14 0 0;14 0 0;-14 0 0" dur="1.6s" repeatCount="indefinite"/>
        <path d="M0 0 C -34 2 -52 -28 -40 -66" fill="none" stroke="#232734" stroke-width="14" stroke-linecap="round"/>
        <path d="M-2 -3 C -32 -1 -48 -28 -38 -62" fill="none" stroke="#5a6279" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      </g></g>

      <!-- body -->
      <ellipse cx="0" cy="-60" rx="68" ry="38" fill="url(#fur)"/>
      <ellipse cx="-12" cy="-80" rx="42" ry="8" fill="#fff" opacity="0.28" transform="rotate(-6 -12 -80)"/>
      <ellipse cx="10" cy="-44" rx="40" ry="5" fill="#fff" opacity="0.08"/>

      <!-- near legs -->
      <g transform="translate(-38 -38)"><g>
        <animateTransform attributeName="transform" type="rotate" values="-22 0 0;22 0 0;-22 0 0" dur="1s" repeatCount="indefinite"/>
        <rect x="-8" y="0" width="16" height="35" rx="8" fill="url(#leg)"/>
        <ellipse cx="3" cy="37" rx="13" ry="7" fill="#5a6279"/>
      </g></g>
      <g transform="translate(34 -38)"><g>
        <animateTransform attributeName="transform" type="rotate" values="22 0 0;-22 0 0;22 0 0" dur="1s" repeatCount="indefinite"/>
        <rect x="-8" y="0" width="16" height="35" rx="8" fill="url(#leg)"/>
        <ellipse cx="3" cy="37" rx="13" ry="7" fill="#5a6279"/>
      </g></g>

      <!-- head -->
      <g transform="translate(66 -88)"><g>
        <animateTransform attributeName="transform" type="rotate" values="-3 0 10;3 0 10;-3 0 10" dur="1s" repeatCount="indefinite"/>
        <polygon points="-32,-10 -28,-48 -4,-30" fill="url(#fur)"/>
        <polygon points="32,-10 28,-48 4,-30" fill="url(#fur)"/>
        <polygon points="-27,-16 -25,-38 -11,-27" fill="#ff9fb8"/>
        <polygon points="27,-16 25,-38 11,-27" fill="#ff9fb8"/>
        <circle cx="0" cy="0" r="34" fill="url(#fur)"/>
        <ellipse cx="-11" cy="-20" rx="14" ry="7" fill="#fff" opacity="0.35" transform="rotate(-20 -11 -20)"/>
        <ellipse cx="-13" cy="-3" rx="8" ry="9" fill="url(#eye)"><animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;0.85;0.9;0.95;1" dur="3s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="13" cy="-3" rx="8" ry="9" fill="url(#eye)"><animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;0.85;0.9;0.95;1" dur="3s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="-13" cy="-3" rx="2.5" ry="7" fill="#0a0d12"/>
        <ellipse cx="13" cy="-3" rx="2.5" ry="7" fill="#0a0d12"/>
        <circle cx="-16" cy="-6" r="2" fill="#fff"/><circle cx="10" cy="-6" r="2" fill="#fff"/>
        <polygon points="-5,10 5,10 0,16" fill="#ff7f9f"/>
        <path d="M0 16 Q-5 22 -11 19 M0 16 Q5 22 11 19" fill="none" stroke="#c9ced9" stroke-width="1.8" stroke-linecap="round"/>
        <g stroke="#d7dbe6" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
          <line x1="-20" y1="14" x2="-50" y2="8"/><line x1="-20" y1="18" x2="-50" y2="20"/>
          <line x1="20" y1="14" x2="50" y2="8"/><line x1="20" y1="18" x2="50" y2="20"/>
        </g>
      </g></g>
    </g>
  </g>
</svg>
