<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/><stop offset="0.5" stop-color="#9db4d6"/><stop offset="1" stop-color="#5b7196"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46587a"/><stop offset="1" stop-color="#1c2740"/>
    </linearGradient>
    <radialGradient id="eye"><stop offset="0" stop-color="#e0ffff"/><stop offset="0.5" stop-color="#22e5ff"/><stop offset="1" stop-color="#0090c0"/></radialGradient>
    <radialGradient id="ball"><stop offset="0" stop-color="#ffb3b3"/><stop offset="1" stop-color="#e5173f"/></radialGradient>
  </defs>

  <!-- ground -->
  <line x1="0" y1="232" x2="800" y2="232" stroke="#8892a6" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- walking robot (moves across) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-120 230;920 230" dur="14s" repeatCount="indefinite"/>

    <!-- shadow -->
    <ellipse cx="0" cy="2" rx="52" ry="8" fill="#000" opacity="0.28">
      <animate attributeName="rx" values="52;44;52" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- bobbing body -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="0.5s" repeatCount="indefinite"/>

      <!-- back arm -->
      <g transform="translate(-50 -115)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="25 0 0;-25 0 0;25 0 0" dur="1s" repeatCount="indefinite"/>
          <rect x="-8" y="0" width="16" height="48" rx="8" fill="url(#dark)"/>
          <circle cx="0" cy="52" r="10" fill="url(#metal)"/>
        </g>
      </g>

      <!-- legs -->
      <g transform="translate(-20 -50)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-24 0 0;24 0 0;-24 0 0" dur="1s" repeatCount="indefinite"/>
          <rect x="-9" y="0" width="18" height="40" rx="8" fill="url(#dark)"/>
          <rect x="-15" y="36" width="34" height="14" rx="7" fill="url(#metal)"/>
        </g>
      </g>
      <g transform="translate(20 -50)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="24 0 0;-24 0 0;24 0 0" dur="1s" repeatCount="indefinite"/>
          <rect x="-9" y="0" width="18" height="40" rx="8" fill="url(#dark)"/>
          <rect x="-15" y="36" width="34" height="14" rx="7" fill="url(#metal)"/>
        </g>
      </g>

      <!-- torso -->
      <rect x="-42" y="-132" width="84" height="84" rx="20" fill="url(#metal)"/>
      <rect x="-42" y="-132" width="84" height="84" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <rect x="-26" y="-112" width="52" height="38" rx="9" fill="url(#dark)"/>
      <circle cx="-14" cy="-93" r="5" fill="#22e5ff"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="-93" r="5" fill="#7dff8a"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="14" cy="-93" r="5" fill="#ffd34d"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
      <rect x="-20" y="-64" width="40" height="6" rx="3" fill="#2a3a5c"/>

      <!-- neck -->
      <rect x="-9" y="-142" width="18" height="14" fill="url(#dark)"/>

      <!-- head -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 0 -140;3 0 -140;-3 0 -140" dur="1s" repeatCount="indefinite"/>
        <line x1="0" y1="-190" x2="0" y2="-208" stroke="#5b7196" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="-212" r="7" fill="url(#ball)"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
        <rect x="-36" y="-192" width="72" height="54" rx="18" fill="url(#metal)"/>
        <rect x="-36" y="-192" width="72" height="54" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
        <rect x="-27" y="-178" width="54" height="28" rx="13" fill="#0f1a30"/>
        <ellipse cx="-12" cy="-164" rx="7" ry="8" fill="url(#eye)"><animate attributeName="ry" values="8;8;1;8;8" keyTimes="0;0.85;0.9;0.95;1" dur="3s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="12" cy="-164" rx="7" ry="8" fill="url(#eye)"><animate attributeName="ry" values="8;8;1;8;8" keyTimes="0;0.85;0.9;0.95;1" dur="3s" repeatCount="indefinite"/></ellipse>
        <rect x="-42" y="-170" width="7" height="22" rx="3" fill="url(#dark)"/>
        <rect x="35" y="-170" width="7" height="22" rx="3" fill="url(#dark)"/>
      </g>

      <!-- front arm -->
      <g transform="translate(50 -115)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-25 0 0;25 0 0;-25 0 0" dur="1s" repeatCount="indefinite"/>
          <rect x="-8" y="0" width="16" height="48" rx="8" fill="url(#metal)"/>
          <circle cx="0" cy="52" r="10" fill="url(#metal)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
