<svg width="1200" height="140" viewBox="0 0 1200 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer Banner - Engineering the future">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1200" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C4774"/>
      <stop offset="50%" stop-color="#295B8E"/>
      <stop offset="100%" stop-color="#1C4774"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4075AD" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#9AD0E2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4075AD" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D3955E" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#9AD0E2" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#D3955E" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="topPulse" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#1C4774" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D3955E"/>
      <stop offset="100%" stop-color="#1C4774" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" rx="14" fill="url(#footerBg)"/>
  <rect x="1" y="1" width="1198" height="138" rx="13" stroke="#4075AD" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="150" y="0" width="900" height="2" fill="url(#topPulse)"/>

  <!-- Animated Wave Layers -->
  <path d="M0 95 Q 300 60 600 95 T 1200 95 L 1200 140 L 0 140 Z" fill="url(#waveGrad1)">
    <animate attributeName="d"
      values="M0 95 Q 300 60 600 95 T 1200 95 L 1200 140 L 0 140 Z;
              M0 95 Q 300 120 600 85 T 1200 95 L 1200 140 L 0 140 Z;
              M0 95 Q 300 60 600 95 T 1200 95 L 1200 140 L 0 140 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <path d="M0 108 Q 300 130 600 105 T 1200 108 L 1200 140 L 0 140 Z" fill="url(#waveGrad2)">
    <animate attributeName="d"
      values="M0 108 Q 300 130 600 105 T 1200 108 L 1200 140 L 0 140 Z;
              M0 108 Q 300 82 600 114 T 1200 108 L 1200 140 L 0 140 Z;
              M0 108 Q 300 130 600 105 T 1200 108 L 1200 140 L 0 140 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Motivational Statement -->
  <text x="600" y="54" text-anchor="middle" fill="#F3F1E2" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.6">
    &#x201C;Engineering intelligence, scalability, and resilience &#x2014; one commit at a time.&#x201D;
  </text>
  <text x="600" y="82" text-anchor="middle" fill="#9AD0E2" font-family="'Fira Code', 'Courier New', monospace" font-size="12" letter-spacing="1.2">
    WISHMITHA DEVINDA DHARMARATHNA • @wishmitha2003
  </text>
</svg>
