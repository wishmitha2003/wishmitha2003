<svg width="920" height="86" viewBox="0 0 920 86" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Building resilient distributed systems, modern full-stack web and mobile applications, and intelligent software — driven by curiosity, clean architecture, and continuous engineering growth.">
  <defs>
